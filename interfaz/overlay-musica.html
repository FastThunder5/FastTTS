<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Overlay — Música</title>
  <link rel="stylesheet" href="./compartido/tema-overlay.css">
  <style>
    :root { --bg-img: none; }
    body {
      background: transparent;
      width: 340px;
      height: 90px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    body.has-bgimg {
      background-image: var(--bg-img);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    /* ?hidden=1: la fuente de OBS sigue reproduciendo audio, solo se
       oculta el widget "reproduciendo ahora". */
    body.om-hidden #om-widget { display: none !important; }
    #om-widget {
      display: none;
      align-items: center;
      gap: 10px;
      height: 100%;
      padding: 10px 14px;
      box-sizing: border-box;
      background: rgba(8, 8, 8, var(--bg-alpha, 0.82));
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #om-thumb {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255,255,255,0.08);
    }
    #om-info { min-width: 0; flex: 1; }
    #om-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #om-channel {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="om-widget">
    <img id="om-thumb" alt="">
    <div id="om-info">
      <div id="om-title"></div>
      <div id="om-channel"></div>
    </div>
  </div>
  <script type="module" src="./overlay-musica.js"></script>
</body>
</html>
